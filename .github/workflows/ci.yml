name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build / vet / test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/omniwa_ci?sslmode=disable
      TEST_RABBITMQ_URL: amqp://omniwa:omniwa@localhost:5672/omniwa_ci
      SOURCE_SHA: ${{ github.sha }}
      SMOKE_VERSION: ci-smoke
      SMOKE_API_KEY: omniwa-container-smoke-key
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omniwa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omniwa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: omniwa
          RABBITMQ_DEFAULT_PASS: omniwa
          RABBITMQ_DEFAULT_VHOST: omniwa_ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          # Exercise the declared compatibility line without pinning CI to the
          # vulnerable initial 1.25.0 toolchain release.
          go-version: 1.25.x
          check-latest: true
          cache: true

      - name: Verify repository
        run: bash scripts/ci/verify-repository.sh
