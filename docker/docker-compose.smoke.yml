services:
  omniwa-go:
    image: ${SMOKE_IMAGE:?Set SMOKE_IMAGE}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${SMOKE_VERSION:?Set SMOKE_VERSION}
        REVISION: ${SOURCE_SHA:?Set SOURCE_SHA}
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: omniwa-smoke
      OS_NAME: OmniWA GO smoke test
      LICENSE_GATE_ENABLED: "false"
      GLOBAL_API_KEY_FILE: /run/secrets/smoke_api_key
      POSTGRES_AUTH_DB_FILE: /run/secrets/smoke_postgres_auth_dsn
      POSTGRES_USERS_DB_FILE: /run/secrets/smoke_postgres_users_dsn
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: "false"
      AMQP_URL: ""
      AMQP_GLOBAL_ENABLED: "false"
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"
      MINIO_ENABLED: "false"
      LOGTYPE: console
    secrets:
      - smoke_api_key
      - smoke_postgres_auth_dsn
      - smoke_postgres_users_dsn
    ports:
      - "127.0.0.1::4000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

secrets:
  smoke_api_key:
    environment: SMOKE_API_KEY
  smoke_postgres_auth_dsn:
    environment: SMOKE_POSTGRES_AUTH_DSN
  smoke_postgres_users_dsn:
    environment: SMOKE_POSTGRES_USERS_DSN
