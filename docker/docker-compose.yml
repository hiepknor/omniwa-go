# Production base: OmniWA GO + Postgres. Config comes from .env (see .env.example).
# Run from this directory:  docker compose up -d
# Add RabbitMQ + MinIO:     docker compose -f docker-compose.yml -f docker-compose.full.yml up -d

name: omniwa-go

services:
  omniwa-go:
    image: ${OMNIWA_IMAGE:?Set OMNIWA_IMAGE to an immutable sha256 digest}
    container_name: omniwa-go
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ${OMNIWA_ENV_FILE:-.env}
    environment:
      GLOBAL_API_KEY_FILE: /run/secrets/omniwa_global_api_key
      POSTGRES_AUTH_DB_FILE: /run/secrets/omniwa_postgres_auth_dsn
      POSTGRES_USERS_DB_FILE: /run/secrets/omniwa_postgres_users_dsn
    secrets:
      - omniwa_global_api_key
      - omniwa_postgres_auth_dsn
      - omniwa_postgres_users_dsn
    volumes:
      - omniwa_data:/app/dbdata
      - omniwa_logs:/app/logs
    networks:
      - omniwa_network
    depends_on:
      postgres:
        condition: service_healthy

  omniwa-migrate:
    image: ${OMNIWA_IMAGE:?Set OMNIWA_IMAGE to an immutable sha256 digest}
    profiles: ["operations"]
    command: ["migrate"]
    environment:
      LICENSE_GATE_ENABLED: ${LICENSE_GATE_ENABLED:-true}
      READINESS_REQUIRE_USERS_DATABASE: ${READINESS_REQUIRE_USERS_DATABASE:-false}
      READINESS_REQUIRE_EVENT_DELIVERY: ${READINESS_REQUIRE_EVENT_DELIVERY:-false}
      READINESS_REQUIRE_MINIO: ${READINESS_REQUIRE_MINIO:-false}
      POSTGRES_AUTH_DB_FILE: /run/secrets/omniwa_postgres_auth_dsn
      POSTGRES_USERS_DB_FILE: /run/secrets/omniwa_postgres_users_dsn
    secrets:
      - omniwa_postgres_auth_dsn
      - omniwa_postgres_users_dsn
    networks:
      - omniwa_network
    depends_on:
      postgres:
        condition: service_healthy

  omniwa-standby:
    image: ${OMNIWA_IMAGE:?Set OMNIWA_IMAGE to an immutable sha256 digest}
    profiles: ["standby"]
    container_name: omniwa-standby
    restart: unless-stopped
    environment:
      RUNTIME_MODE: standby
      SERVER_PORT: "4000"
    ports:
      - "127.0.0.1:4001:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/server/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - standby_control

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an immutable sha256 digest}
    container_name: omniwa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/omniwa_postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    secrets:
      - omniwa_postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - omniwa_network

volumes:
  omniwa_data:
  omniwa_logs:
  postgres_data:

networks:
  omniwa_network:
    driver: bridge
  standby_control:
    driver: bridge

secrets:
  omniwa_global_api_key:
    file: ${OMNIWA_GLOBAL_API_KEY_FILE:?Set OMNIWA_GLOBAL_API_KEY_FILE to a readable secret file}
  omniwa_postgres_auth_dsn:
    file: ${OMNIWA_POSTGRES_AUTH_DSN_FILE:?Set OMNIWA_POSTGRES_AUTH_DSN_FILE to a readable secret file}
  omniwa_postgres_users_dsn:
    file: ${OMNIWA_POSTGRES_USERS_DSN_FILE:?Set OMNIWA_POSTGRES_USERS_DSN_FILE to a readable secret file}
  omniwa_postgres_password:
    file: ${OMNIWA_POSTGRES_PASSWORD_FILE:?Set OMNIWA_POSTGRES_PASSWORD_FILE to a readable secret file}
