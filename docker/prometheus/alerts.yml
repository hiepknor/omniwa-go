groups:
  - name: omniwa-dependency-health
    rules:
      - alert: OmniWARequiredDependencyUnavailable
        expr: max by (dependency) (omniwa_dependency_health{dependency=~"users_database|external_event_outbox",status="unavailable"}) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A required OmniWA dependency is unavailable

      - alert: OmniWAOptionalDependencyUnavailable
        expr: max by (dependency) (omniwa_dependency_health{dependency=~"rabbitmq|legacy_media|media_assets|campaign_media",status="unavailable"}) == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: An optional OmniWA dependency is unavailable

      - alert: OmniWADependencyHealthUnknown
        expr: max by (dependency) (omniwa_dependency_health{status="unknown"}) == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A configured OmniWA dependency has not completed its first health check

      - alert: OmniWADependencyHealthStale
        expr: time() - omniwa_dependency_last_check_timestamp_seconds > 45
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A configured OmniWA dependency health check is stale

  - name: omniwa-webhook-delivery
    rules:
      - alert: OmniWAExternalDeliveryDeadLettered
        expr: sum(increase(omniwa_external_event_outbox_attempts_total{outcome="dead_letter"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: An external event delivery was dead-lettered

      - alert: OmniWAExternalDeliveryBacklog
        expr: omniwa_external_event_outbox_oldest_pending_age_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The oldest external event delivery has been pending for more than five minutes

      - alert: OmniWAExternalDeliveryDeadLetterBacklog
        expr: omniwa_external_event_outbox_rows{status="dead_letter"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: External event dead letters require operator review

      - alert: OmniWAExternalDeliveryInfrastructureFailure
        expr: sum(increase(omniwa_external_event_outbox_infrastructure_failures_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: The external event worker reported an infrastructure failure

      - alert: OmniWAWebhookSignatureRejected
        expr: sum(increase(omniwa_webhook_receiver_signature_total{outcome=~"missing|invalid|stale"}[5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: The operator webhook receiver rejected a signature

      - alert: OmniWAWebhookReceiverNotEnforcing
        expr: omniwa_webhook_receiver_mode{mode="require"} != 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The operator webhook receiver is not enforcing signatures
