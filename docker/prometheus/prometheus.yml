global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: omniwa-go
    metrics_path: /metrics
    http_headers:
      apikey:
        files:
          - /tmp/omniwa-metrics-api-key
    static_configs:
      - targets:
          - omniwa-go:4000
